name: Member architecture validation

on:
  push:
    branches:
      - develop/member-data-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Firebase rules test tooling
        run: npm install --no-save --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5
      - name: Firestore security emulator tests
        run: npx firebase emulators:exec --project demo-fermi-member-rules --only firestore "node tests/firestore-membership-rules.cjs"
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
